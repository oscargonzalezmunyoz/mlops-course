name: CI - Training Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # Download the repository files onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
      # Install the Python version used in development
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install all project libraries
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Download the diabetes dataset and save to data/raw/
      - name: Load raw data
        run: python -m src.data.load_data
      # Check field types and required columns with Pydantic
      - name: Validate data
        run: python -m src.data.validate_data
      # Fill nulls, fix types -> data/processed/train_v1.csv
      - name: Preprocess data
        run: python -m src.data.preprocess
      # Add new features to the input data -> data/processed/train_features_v1.csv    
      - name: Feature engineering
        run: python -m src.data.features
      # Train LinearRegression, RandomForest and GradientBoosting; log runs to MLflow
      - name: Train models
        run: python -m src.models.train
      # Register the best run in the MLflow Model Registry
      - name: Register models
        run: python -m src.models.register_model
      # Run quality gate: exit 1 if rmse >= 60.0 or r2 <= 0.40
      - name: Evaluate models
        run: python -m src.models.evaluate_model
      # Build the API image
      - name: Build API image
        run: docker build -t mlops-api .
      # Start the api in background, wait until /health answers
      - name: Start API
        run: |
          docker run -d --name api -p 8000:8000 mlops-api
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health; then
              echo "API ready after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "API did not answer in 30 seconds"
          exit 1
      # Smoke tests using the same script used locally
      - name: Test API
        run: bash run_test_api.sh
      - name: API logs
        if: failure()
        run: |
          docker ps -a
          docker logs api
      

      
